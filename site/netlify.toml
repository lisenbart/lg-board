[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# SPA fallback. Do not add /originals slash-force redirects (that belongs to lisenbart.com).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
