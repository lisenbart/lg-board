<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lisenbart Games — the games division of LISENBART</title>
    <meta
      name="description"
      content="Trailers, cinematics, ad creatives, playables and in-game motion for mobile and PC games. The games division of LISENBART, directed by Dmytro Lisenbart."
    />
    <link rel="canonical" href="https://lisenbart.games/" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body>
    <a class="skip" href="#showreel">Skip to showreel</a>

    <header class="top" id="top">
      <a class="brand" href="/">
        <img
          src="/logo.png"
          width="322"
          height="209"
          alt="LISENBART GAMES ANIMATION"
        />
      </a>
      <p class="brand-mark">A LISENBART studio</p>
      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="menu"
      >
        Menu
      </button>
      <nav class="nav" id="menu" aria-label="Page">
        <a href="#showreel">Showreel</a>
        <a class="nav-mail" href="mailto:dmytro@lisenbart.games">Start a project</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <p class="label">Kyiv / Warsaw</p>
        <h1 id="hero-title" class="display">Director-led animation for games</h1>
        <p class="lead">
          Trailers, cinematics, ad creatives, playables and in-game motion for
          mobile and PC. Directed by Dmytro Lisenbart — 25 years in game
          cinematics.
        </p>
        <div class="actions">
          <a class="btn" href="mailto:dmytro@lisenbart.games">Start a project →</a>
          <a class="text-link" href="#showreel">Watch showreel ↓</a>
        </div>
      </section>

      <section id="showreel" class="showreel" aria-label="Showreel">
        <div class="reel" data-vimeo="944158555">
          <button type="button" class="reel-play" aria-label="Play showreel">
            <img
              src="/media/showreel-poster.jpg"
              alt=""
              width="1280"
              height="720"
            />
            <span class="play-disc" aria-hidden="true">Play</span>
            <span class="reel-label" aria-hidden="true">Showreel</span>
          </button>
        </div>
      </section>
    </main>

    <noscript>
      <p>
        Write to
        <a href="mailto:dmytro@lisenbart.games">dmytro@lisenbart.games</a>.
        Showreel:
        <a href="https://vimeo.com/944158555">vimeo.com/944158555</a>.
      </p>
    </noscript>
    <script src="/js/site.js" defer></script>
  </body>
</html>
